services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dispositivos_medicos
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: dispositivos_medicos
      DB_USER: root
      DB_PASSWORD: root123
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
  
  #Servicio de autenticación que se encarga del registro y login de usuarios
  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: dispositivos_medicos
      DB_USER: root
      DB_PASSWORD: root123
      PORT: 5000
      JWT_SECRET: clave-desarrollo-taller1
    ports:
      - "5000:5000"
    #Se necesita sí o sí que la base de MariaDB esté disponible
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./auth-service:/auth

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
      #Esta es la dirección del servicio de autenticación
      VITE_AUTH_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mariadb_data:
