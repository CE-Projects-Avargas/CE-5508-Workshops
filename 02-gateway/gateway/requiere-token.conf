# Rutas protegidas: la puerta exige que venga la cabecera, pero NO valida la firma.
# La firma, exp, iss y aud los valida cada servicio (defensa en profundidad).
# Va despues de cors.conf para que el preflight OPTIONS (sin token) responda 204 antes.

if ($sin_token) {
  return 401 '{"error":"Token requerido"}';
}
