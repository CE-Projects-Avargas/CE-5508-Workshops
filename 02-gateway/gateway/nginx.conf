# ─────────────────────────────────────────────────────────────
# CE5508 · Taller 2 — API Gateway
#
# Un solo punto de entrada. El navegador habla SIEMPRE con :8080
# y nunca sabe cuántos servicios hay detrás ni en qué puerto viven.
#
# Este archivo ya funciona. Léanlo: es la topología del sistema
# escrita en doce líneas.
# ─────────────────────────────────────────────────────────────

events {}

http {
  # CORS resuelto UNA vez, aquí, en vez de en cada servicio.
  map $http_origin $cors {
    default "";
    "~^http://localhost:5173$" $http_origin;
  }

  server {
    listen 8080;

    # ── Rotación de llaves: solo uso interno ───────
    # No se expone por la puerta. ~* y /? cubren mayúsculas y
    # barra final, que Express aceptaría igual.
    location ~* ^/api/auth/rotar-clave/?$ {
      return 404;
    }

    # ── Autenticación ──────────────────────────────
    # /api/auth/login  →  auth-service:4001/auth/login
    location /api/auth/ {
      proxy_pass http://auth-service:4001/auth/;
      include /etc/nginx/cors.conf;
    }

    # ── Bombas ─────────────────────────────────────
    # /api/bombas/1/iniciar  →  pump-service:4002/bombas/1/iniciar
    location /api/bombas {
      proxy_pass http://pump-service:4002/bombas;
      include /etc/nginx/cors.conf;
      if ($http_authorization = "") { return 401; }   # exige la cabecera; la firma la valida el servicio
    }

    # ── Catálogo de productos ──────────────────────
    location /api/productos {
      proxy_pass http://pump-service:4002/productos;
      include /etc/nginx/cors.conf;
      if ($http_authorization = "") { return 401; }   # exige la cabecera; la firma la valida el servicio
    }

    # ── Todo lo demás va al backend ────────────────
    # /api/proyectos  →  backend:4000/proyectos
    location /api/ {
      proxy_pass http://backend:4000/;
      include /etc/nginx/cors.conf;
      if ($http_authorization = "") { return 401; }   # exige la cabecera; la firma la valida el servicio
    }
  }
}
