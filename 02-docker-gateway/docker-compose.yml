services:

  # Base de datos exclusiva del servicio de autenticación
  auth-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: auth_root123
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth123
    volumes:
      - auth_db_data:/var/lib/mysql
      - ./database/auth/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10


  # Base de datos exclusiva del backend de proyectos
  backend-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: backend_root123
      MYSQL_DATABASE: backend_db
      MYSQL_USER: backend_user
      MYSQL_PASSWORD: backend123
    volumes:
      - backend_db_data:/var/lib/mysql
      - ./database/backend/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10


  # Backend de proyectos
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: backend-db
      DB_PORT: 3306
      DB_NAME: backend_db
      DB_USER: backend_user
      DB_PASSWORD: backend123
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      backend-db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules


  # Servicio de autenticación en Python/Flask
  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DB_HOST: auth-db
      DB_PORT: 3306
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: auth123
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ./auth-service:/app


  # Frontend React
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Gateway de API
  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - backend


volumes:
  auth_db_data:
  backend_db_data: