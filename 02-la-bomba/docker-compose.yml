# CE5508 · Taller 2 — La bomba y la colaboración entre servicios
#
# Traigan del Taller 1 sus carpetas backend/, frontend/ y auth-service/
# y colóquenlas junto a este archivo. Todo lo demás ya está listo.

services:
  gateway:                       # ÚNICO punto de entrada del sistema
    image: nginx:alpine          # BSD-2 · imagen oficial
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/cors.conf:/etc/nginx/cors.conf:ro
    depends_on: [backend, pump-service]   # auth-service lo agregan ustedes

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dispositivos_medicos
    ports: ["3306:3306"]
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:                       # del Taller 1 — se le agrega el filtro por dueño
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      JWT_SECRET: secreto-compartido-del-taller
      PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      mariadb: { condition: service_healthy }

  # ═══════════════════════════════════════════════════════════
  #  FALTA UN SERVICIO: el de autenticación. LO AGREGAN USTEDES.
  #
  #  Es el que construyeron en el Taller 1. Aquí no está declarado
  #  a propósito: agregar un servicio a un compose es parte de lo
  #  que hay que saber hacer.
  #
  #  El gateway ya enruta /api/auth hacia  auth-service:4001
  #  así que su bloque tiene que cumplir estas condiciones:
  #
  #    · llamarse exactamente  auth-service   (es el nombre que
  #      el gateway resuelve en la red de Docker)
  #    · escuchar en el puerto 4001 dentro del contenedor
  #    · usar el MISMO valor de JWT_SECRET que los demás
  #      (si no, la firma que emite no la puede verificar nadie)
  #    · esperar a que mariadb esté saludable antes de arrancar
  #
  #  Mientras no lo agreguen, /api/auth/login devuelve 502.
  #  Ese error es la pista: el gateway busca un servicio que no existe.
  # ═══════════════════════════════════════════════════════════

  pump-service:                  # NUEVO — el reto de este taller
    build: ./pump-service
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      BACKEND_URL: http://backend:4000
      JWT_SECRET: secreto-compartido-del-taller
      PORT: 4002
    ports: ["4002:4002"]         # expuesto a propósito: ver §"saltarse el gateway"
    depends_on:
      mariadb: { condition: service_healthy }
    volumes:
      - ./pump-service:/app
      - /app/node_modules

  frontend:                      # del Taller 1 — se le agrega la consola
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8080/api   # una sola URL
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  mariadb_data:
