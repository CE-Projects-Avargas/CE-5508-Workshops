# Taller 3: RabbitMQ es el broker; cada nuevo servicio tiene su propia BD.
name: ce5508-taller3
services:
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
    - 8080:8080
    volumes:
    - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./gateway/cors.conf:/etc/nginx/cors.conf:ro
    depends_on:
    - backend
    - pump-service
    - auth-service
    - device-service
    networks:
    - borde
    - interna
  auth-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
    volumes:
    - auth_data:/var/lib/mysql
    - ./database/init/auth:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - datos-auth
  operacion-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
    volumes:
    - operacion_data:/var/lib/mysql
    - ./database/init/operacion:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - datos-operacion
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: operacion-db
      DB_NAME: operacion
      DB_USER: backend_user
      DB_PASSWORD: backend_pass
      AUTH_JWKS_URL: http://auth-service:4001/auth/jwks
      JWT_ISS: auth-service
      JWT_AUD: ce5508-taller2
      JWKS_CACHE_TTL_MS: 300000
      JWKS_CACHE_MAX_ENTRIES: 5
      JWKS_REQUESTS_PER_MINUTE: 10
      PORT: 4000
    ports:
    - 4000:4000
    depends_on:
      operacion-db:
        condition: service_healthy
    networks:
    - interna
    - datos-operacion
  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DB_HOST: auth-db
      DB_NAME: autenticacion
      DB_USER: auth_user
      DB_PASSWORD: auth_pass
      PORT: 4001
      KEYS_DIR: /keys
    volumes:
    - auth_keys:/keys
    ports:
    - 4001:4001
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
    - interna
    - datos-auth
  pump-service:
    build: ./pump-service
    restart: unless-stopped
    environment:
      DB_HOST: operacion-db
      DB_NAME: operacion
      DB_USER: pump_user
      DB_PASSWORD: pump_pass
      BACKEND_URL: http://backend:4000
      AUTH_JWKS_URL: http://auth-service:4001/auth/jwks
      JWT_ISS: auth-service
      JWT_AUD: ce5508-taller2
      JWKS_CACHE_TTL_MS: 300000
      JWKS_CACHE_MAX_ENTRIES: 5
      JWKS_REQUESTS_PER_MINUTE: 10
      PORT: 4002
    ports:
    - 4002:4002
    depends_on:
      operacion-db:
        condition: service_healthy
    volumes:
    - ./pump-service:/app
    - /app/node_modules
    networks:
    - interna
    - datos-operacion
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
    - 5173:5173
    depends_on:
    - gateway
    networks:
    - borde
  device-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
    volumes:
    - device_data:/var/lib/mysql
    - ./database/init/device:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - datos-device
  notification-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
    volumes:
    - notification_data:/var/lib/mysql
    - ./database/init/notification:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - datos-notification
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: taller
      RABBITMQ_DEFAULT_PASS: taller_pass
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
    - eventos
  device-service:
    build: ./device-service
    restart: unless-stopped
    environment:
      DB_HOST: device-db
      DB_NAME: devices
      DB_USER: device_user
      DB_PASSWORD: device_pass
      PORT: 4003
      BACKEND_URL: http://backend:4000
      AUTH_JWKS_URL: http://auth-service:4001/auth/jwks
      JWT_ISS: auth-service
      JWT_AUD: ce5508-taller2
      RABBITMQ_URL: amqp://taller:taller_pass@rabbitmq:5672
      RABBITMQ_EXCHANGE: devices.events
      RABBITMQ_QUEUE: notifications.devices
    depends_on:
      device-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      backend:
        condition: service_started
    networks:
    - interna
    - datos-device
    - eventos
  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment:
      DB_HOST: notification-db
      DB_NAME: notifications
      DB_USER: notification_user
      DB_PASSWORD: notification_pass
      RABBITMQ_URL: amqp://taller:taller_pass@rabbitmq:5672
      RABBITMQ_EXCHANGE: devices.events
      RABBITMQ_QUEUE: notifications.devices
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - datos-notification
    - eventos
networks:
  borde: null
  interna: null
  datos-auth: null
  datos-operacion: null
  datos-device: null
  datos-notification: null
  eventos: null
volumes:
  auth_data: null
  operacion_data: null
  auth_keys: null
  device_data: null
  notification_data: null
  rabbitmq_data: null
