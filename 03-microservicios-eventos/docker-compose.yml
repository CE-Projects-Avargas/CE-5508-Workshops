services:

  # ===== ENTRADA: la unica puerta =====
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/cors.conf:/etc/nginx/cors.conf:ro
      - ./gateway/exigir-token.conf:/etc/nginx/exigir-token.conf:ro
    depends_on:                  # la puerta abre cuando los servicios estan sanos
      auth-service:
        condition: service_healthy
      backend:
        condition: service_healthy
      device-service:
        condition: service_healthy
    networks: [borde, interna]

  # ===== DATOS: una base por servicio, cada una en su propia red =====
  backend-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
    volumes:
      - backend_db_data:/var/lib/mysql
      - ./backend-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [datos-backend]
    # Sin "ports": no se expone fuera de Docker

  auth-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
    volumes:
      - auth_db_data:/var/lib/mysql
      - ./auth-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [datos-auth]

  device-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
    volumes:
      - device_db_data:/var/lib/mysql
      - ./device-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [datos-device]

  notification-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
    volumes:
      - notification_db_data:/var/lib/mysql
      - ./notification-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [datos-notification]

  # ===== BROKER DE EVENTOS =====
  rabbitmq:
    image: rabbitmq:3-management
    # RabbitMQ guarda sus datos en una carpeta con el nombre del host. Sin un
    # hostname fijo, al recrear el contenedor cambia y las colas y mensajes
    # pendientes "desaparecen" aunque el volumen siga ahi.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: eventos
      RABBITMQ_DEFAULT_PASS: eventos123
    ports:
      - "15672:15672"   # panel web, solo para ver los mensajes durante el taller
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [mensajeria]

  # ===== SERVICIOS =====
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: backend-db
      DB_PORT: 3306
      DB_NAME: operacion
      DB_USER: backend_user
      DB_PASSWORD: backend_pass
      PORT: 4000
      JWKS_URL: http://auth-service:5001/auth/jwks   # por la red "interna"
      JWT_ISSUER: ce5508-auth-service
      JWT_AUDIENCE: ce5508-backend
    ports:
      - "4000:4000"   # expuesto A PROPOSITO para probar el Req 4 (saltarse la puerta)
    healthcheck:                 # sano = responde en su puerto (wget viene en alpine)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      backend-db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks: [interna, datos-backend]

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DB_HOST: auth-db
      DB_PORT: 3306
      DB_NAME: auth
      DB_USER: auth_user
      DB_PASSWORD: auth_pass
      PORT: 5001
      KEYS_DIR: /keys
      JWT_ISSUER: ce5508-auth-service
      JWT_AUDIENCE: ce5508-backend
      ACCESS_TTL_MIN: 15
      REFRESH_TTL_H: 8
    healthcheck:                 # sano = responde en su puerto (la imagen slim no trae curl)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ./auth-service:/app
      - auth_keys:/keys        # clave PRIVADA: se monta SOLO aqui
    networks: [interna, datos-auth]

  device-service:
    build: ./device-service
    restart: unless-stopped
    environment:
      DB_HOST: device-db
      DB_PORT: 3306
      DB_NAME: dispositivos
      DB_USER: device_user
      DB_PASSWORD: device_pass
      PORT: 4100
      JWKS_URL: http://auth-service:5001/auth/jwks   # por la red "interna"
      JWT_ISSUER: ce5508-auth-service
      JWT_AUDIENCE: ce5508-backend
      RABBITMQ_URL: amqp://eventos:eventos123@rabbitmq:5672   # por la red "mensajeria"
      BACKEND_URL: http://backend:4000   # dueno de los proyectos, por la red "interna"
    healthcheck:                 # sano = responde en su puerto (wget viene en alpine)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4100/"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      device-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./device-service:/app
      - /app/node_modules
    networks: [interna, datos-device, mensajeria]
    # Sin "ports": solo se llega por el gateway

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment:
      DB_HOST: notification-db
      DB_PORT: 3306
      DB_NAME: notificaciones
      DB_USER: notification_user
      DB_PASSWORD: notification_pass
      PORT: 4200
      RABBITMQ_URL: amqp://eventos:eventos123@rabbitmq:5672   # por la red "mensajeria"
      MAX_INTENTOS: 10           # tras 10 intentos fallidos el mensaje va a la DLQ
    healthcheck:                 # sano = conectado a RabbitMQ y consumiendo
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200/"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./notification-service:/app
      - /app/node_modules
    networks: [datos-notification, mensajeria]
    # Sin "ports" y fuera de "interna": no tiene API publica, nadie le habla
    # por HTTP. Solo recibe eventos de RabbitMQ y escribe en su base.

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8080/api   # UNA sola direccion: la puerta
    ports:
      - "5173:5173"
    depends_on: [gateway]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [borde]

# Redes: cada servicio solo alcanza lo que necesita.
networks:
  borde:          # navegador <-> gateway
  interna:        # gateway <-> servicios
  datos-auth:     # SOLO auth-service <-> auth-db
  datos-backend:  # SOLO backend <-> backend-db
  datos-device:   # SOLO device-service <-> device-db
  datos-notification:  # SOLO notification-service <-> notification-db
  mensajeria:     # SOLO servicios que publican/consumen <-> rabbitmq

volumes:
  backend_db_data:
  auth_db_data:
  auth_keys:
  device_db_data:
  notification_db_data:
  rabbitmq_data: