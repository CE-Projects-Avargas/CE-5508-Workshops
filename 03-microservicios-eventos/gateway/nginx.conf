# CE5508 - Taller 2: la puerta de entrada (gateway)
#
#   /api/auth/*  ->  auth-service:5001/auth/*
#   /api/*       ->  backend:4000/*
#
# EXIGE que traigan carnet (cabecera Authorization), pero NO comprueba si es
# falso. La firma y los claims los comprueba cada servicio por su cuenta.

events {}

http {
  # DNS interno de Docker, consultado en cada peticion: si auth-service esta
  # caido la puerta responde 502, en vez de que nginx ni siquiera arranque.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Las respuestas que genera la propia puerta (401, 404, 502) van en JSON.
  default_type application/json;

  # CORS resuelto UNA vez, aqui. Solo se acepta el origen del frontend.
  map $http_origin $cors {
    default "";
    "~^http://localhost:5173$"  $http_origin;
    "~^http://127.0.0.1:5173$"  $http_origin;
  }

  # Rutas publicas (no exigen cabecera). Todo lo demas si.
  map $uri $ruta_publica {
    default               0;
    /api/auth/register    1;
    /api/auth/login       1;
    /api/auth/refresh     1;
    /api/auth/jwks        1;
  }

  server {
    listen 8080;

    set $auth_upstream    auth-service:5001;
    set $backend_upstream backend:4000;

    error_page 502 503 504 = @servicio_caido;

    # /api/auth/login  ->  auth-service:5001/auth/login
    location /api/auth/ {
      include /etc/nginx/cors.conf;
      include /etc/nginx/exigir-token.conf;
      rewrite ^/api/auth/(.*)$ /auth/$1 break;
      proxy_pass http://$auth_upstream;
    }

    # /api/proyectos  ->  backend:4000/proyectos
    location /api/ {
      include /etc/nginx/cors.conf;
      include /etc/nginx/exigir-token.conf;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$backend_upstream;
    }

    location @servicio_caido {
      add_header Access-Control-Allow-Origin $cors always;
      return 502 '{"error":"servicio no disponible (502 desde el gateway)"}';
    }

    location / {
      return 404 '{"error":"ruta no existe en el gateway"}';
    }
  }
}