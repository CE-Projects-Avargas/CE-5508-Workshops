# La puerta exige que la cabecera Authorization EXISTA en las rutas no publicas.
# No verifica la firma: eso lo hace cada servicio (rodear la puerta no basta).
set $falta_token "";
if ($ruta_publica = 0) { set $falta_token "1"; }
if ($http_authorization = "") { set $falta_token "${falta_token}1"; }
if ($falta_token = "11") {
  add_header Access-Control-Allow-Origin $cors always;
  return 401 '{"error":"falta la cabecera Authorization (gateway)"}';
}